<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BRB carousel cards</title>
<!--
  The five cards of the tap-through carousel ad.
  ?card=1..5  &format=square (1080x1080, Facebook and Instagram feed) or story (1080x1920, Stories and Reels).
  The story version is the square card scaled into Meta's safe zone (14% top, 35% bottom, 6% sides clear).
  render-cards.cjs screenshots all ten.
-->
<style>
@font-face { font-family: Michroma; src: url(../../assets/fonts/michroma-400-latin.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Manrope; src: url(../../assets/fonts/manrope-var-latin.woff2) format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'DM Mono'; src: url(../../assets/fonts/dmmono-400-latin.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'DM Mono'; src: url(../../assets/fonts/dmmono-500-latin.woff2) format('woff2'); font-weight: 500; }
:root {
  --brand: #1d5cff; --lift: #4c7dff; --rgb: 76, 125, 255;
  --bgd: #0d1013; --panel: #15181d; --bubble: #2a3039; --line: rgba(220, 227, 239, .1);
  --ink: #f3f6fb; --muted: #a8b2c4; --dim: #8b95a8; --red: #ff5d6c; --redrgb: 255, 93, 108;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; overflow: hidden; background: var(--bgd); color: var(--ink); font-family: Manrope, sans-serif; -webkit-font-smoothing: antialiased; }
#bg { position: absolute; left: 0; top: 0; }
#card { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; padding: 76px 84px 72px; display: flex; flex-direction: column; transform-origin: 0 0; }
.top { display: flex; align-items: center; gap: 18px; font-family: Michroma; font-size: 21px; letter-spacing: .07em; }
.top svg { width: 52px; height: 52px; }
.top .count { margin-left: auto; font-family: 'DM Mono'; font-size: 22px; letter-spacing: .1em; color: var(--dim); }
main { flex: 1; display: flex; flex-direction: column; gap: 26px; margin-top: 48px; min-height: 0; }
.eyebrow { font-family: 'DM Mono'; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--lift); }
.eyebrow.bad { color: var(--red); }
h1 { margin: 0; font-size: 70px; line-height: 1.04; letter-spacing: -.03em; font-weight: 800; text-wrap: balance; }
h1 .hl { color: var(--lift); } h1 .bad { color: var(--red); }
footer { display: flex; justify-content: flex-end; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; color: var(--ink); }
footer i { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); box-shadow: 0 12px 34px rgba(var(--rgb), .55); }

.chat { background: var(--panel); border-radius: 40px; padding: 26px 30px 30px; box-shadow: inset 0 0 0 1.5px var(--line), 0 30px 80px rgba(0, 0, 0, .45); }
.chathead { display: flex; align-items: center; gap: 18px; padding-bottom: 20px; border-bottom: 1.5px solid var(--line); }
.avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 28px; color: #fff; background: linear-gradient(140deg, #f0a37a, #d0637c); }
.chathead b { display: block; font-size: 28px; line-height: 1.2; }
.chathead small { display: block; font-size: 20px; color: var(--dim); }
.chathead .when { margin-left: auto; font-family: 'DM Mono'; font-size: 22px; color: var(--muted); }
.chathead .fast { margin-left: auto; padding: 10px 20px; border-radius: 999px; background: var(--brand); font-family: 'DM Mono'; font-size: 21px; letter-spacing: .04em; box-shadow: 0 10px 30px rgba(var(--rgb), .5); }
.thread { display: flex; flex-direction: column; gap: 14px; padding-top: 22px; }
.msg { max-width: 80%; padding: 18px 24px; border-radius: 30px; font-size: 30px; line-height: 1.3; font-weight: 600; }
.msg.in { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 10px; }
.msg.out { align-self: flex-end; background: var(--brand); border-bottom-right-radius: 10px; }
.msg.faded { opacity: .45; }
.stamp { margin: -4px 0 0 8px; font-family: 'DM Mono'; font-size: 19px; color: var(--dim); }
.divider { align-self: center; padding: 8px 20px; border-radius: 999px; background: rgba(255, 255, 255, .07); font-family: 'DM Mono'; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px; font-size: 26px; font-weight: 800; }
.pill.lost { align-self: flex-start; color: var(--red); background: rgba(var(--redrgb), .14); box-shadow: inset 0 0 0 2px rgba(var(--redrgb), .5); }
.pill.won { align-self: center; color: #d6e1ff; background: rgba(var(--rgb), .16); box-shadow: inset 0 0 0 2px rgba(var(--rgb), .6); }

.fixes { display: flex; flex-direction: column; gap: 14px; }
.fix { display: grid; grid-template-columns: 52px 1fr; gap: 4px 20px; align-items: center; padding: 18px 24px; border-radius: 26px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line); }
.fix .x { grid-row: 1 / span 2; width: 52px; height: 52px; border-radius: 16px; background: var(--brand); display: grid; place-items: center; }
.fix s { font-size: 24px; color: var(--muted); text-decoration-color: rgba(var(--redrgb), .8); text-decoration-thickness: 2px; }
.fix b { font-size: 31px; line-height: 1.2; }

.end { align-items: center; text-align: center; justify-content: center; gap: 30px; margin-top: 0; }
.end .lock { display: flex; align-items: center; gap: 26px; }
.end .lock svg { width: 104px; height: 104px; }
.end .lock b { font-family: Michroma; font-weight: 400; font-size: 38px; letter-spacing: .05em; text-align: left; line-height: 1.25; }
.end h1 { font-size: 76px; }
.end p { margin: -6px 0 0; font-size: 28px; color: var(--muted); max-width: 760px; }
.end .cta { padding: 0 56px; height: 116px; line-height: 116px; border-radius: 58px; background: var(--brand); font-size: 46px; font-weight: 800; box-shadow: 0 26px 70px rgba(var(--rgb), .5), inset 0 1.5px 0 rgba(255, 255, 255, .3); }
.end .tel { font-size: 36px; font-weight: 700; } .end .tel span { color: var(--muted); font-weight: 600; }
.end .fine { font-family: 'DM Mono'; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
</style>
</head>
<body>
<canvas id="bg" width="1080" height="1080"></canvas>
<div id="card"></div>
<script>
const q = new URLSearchParams(location.search);
const N = +(q.get('card') || 1), STORY = q.get('format') === 'story', H = STORY ? 1920 : 1080;
const MARK = '<svg viewBox="0 0 40 40"><rect x="1.25" y="1.25" width="37.5" height="37.5" rx="4.5" fill="none" stroke="#dce3ef" stroke-opacity=".3" stroke-width="1.5"/><path d="M9 28.5 H31" stroke="#dce3ef" stroke-opacity=".6" stroke-width="3" stroke-linecap="square"/><path d="M9 22 L29 11.5" stroke="#4c7dff" stroke-width="3" stroke-linecap="square"/><circle cx="30.25" cy="10.75" r="3.25" fill="#4c7dff"/></svg>';
const ARROW = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const CHECK = c => `<svg width="28" height="28" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const XMARK = '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>';
const SARAH = 'Hi! Do you fix roof leaks? Water is coming in over the kitchen.';
const head = right => `<div class="chathead"><div class="avatar">S</div><div><b>Sarah M.</b><small>New lead · text message</small></div>${right}</div>`;

const CARDS = {
  1: { glow: 'blue', html: `
    <div class="eyebrow">9:47 PM · New lead</div>
    <h1>A customer texts you at 9:47&nbsp;PM.</h1>
    <div class="chat">${head('<span class="when">9:47 PM</span>')}
      <div class="thread"><div class="msg in">${SARAH}</div><div class="stamp">Delivered 9:47 PM</div></div></div>`,
    next: 'What happens next?' },
  2: { glow: 'red', html: `
    <div class="eyebrow bad">Nobody answered</div>
    <h1>You lost it to the one that <span class="bad">answered first.</span></h1>
    <div class="chat">${head('<span class="when">7:12 AM</span>')}
      <div class="thread"><div class="msg in faded">${SARAH}</div>
        <div class="divider">Next morning · 7:12 AM</div>
        <div class="msg in">Never mind. Found someone who answered right away.</div>
        <div class="pill lost">${XMARK}Job lost</div></div></div>`,
    next: 'Now the other ending' },
  3: { glow: 'blue2', html: `
    <div class="eyebrow">Same text · With Business Runs Better</div>
    <h1>Answered in <span class="hl">4 seconds.</span> Booked by 9:48.</h1>
    <div class="chat">${head('<span class="fast">Replied in 4 sec</span>')}
      <div class="thread"><div class="msg in">${SARAH}</div>
        <div class="msg out">Hi Sarah, sorry about the leak! We can come out tomorrow. Does 10:30 AM work?</div>
        <div class="pill won">${CHECK('currentColor')}Booked · Tomorrow 10:30 AM</div></div></div>`,
    next: 'What else eats your week?' },
  4: { glow: 'blue', html: `
    <div class="eyebrow">The rest of your week</div>
    <h1>The busywork, <span class="hl">handled.</span></h1>
    <div class="fixes">
      ${[['Missed calls on the job', 'Answered and booked for you'],
         ['The same questions all day', 'Answered instantly, day or night'],
         ['Quotes at 10 PM', 'Drafted from your price list'],
         ['A website nobody finds', 'Found on Google, rings your phone'],
         ['Ads you can’t measure', 'Tracked to booked jobs']]
        .map(([a, b]) => `<div class="fix"><span class="x">${CHECK('#fff')}</span><s>${a}</s><b>${b}</b></div>`).join('')}
    </div>`,
    next: 'One call to start' },
  5: { glow: 'blue2', end: true, html: `
    <div class="lock">${MARK}<b>BUSINESS<br>RUNS BETTER</b></div>
    <h1>Book a free <span class="hl" style="white-space:nowrap">20-minute</span> call.</h1>
    <p>No pitch deck. Mike tells you honestly what he'd fix first.</p>
    <div class="cta">businessrunsbetter.com</div>
    <div class="tel"><span>or call</span> 910-524-0056</div>
    <div class="fine">Websites from $499 · AI builds from $2,500 · Leland, NC</div>` }
};

const c = CARDS[N];
document.getElementById('card').innerHTML = `
  <header class="top">${c.end ? '' : MARK + 'BUSINESS RUNS BETTER'}<span class="count">${N} / 5</span></header>
  <main class="${c.end ? 'end' : ''}">${c.html}</main>
  ${c.next ? `<footer>${c.next}<i>${ARROW}</i></footer>` : ''}`;

// background: the same glow and floor grid as the video
document.documentElement.style.height = document.body.style.height = H + 'px';
const bg = document.getElementById('bg'); bg.height = H; const g = bg.getContext('2d');
g.fillStyle = '#0d1013'; g.fillRect(0, 0, 1080, H);
const cy = STORY ? 760 : 620;
const glow = (r, col, a) => { const rg = g.createRadialGradient(540, cy, 0, 540, cy, r); rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(1, `rgba(${col},0)`); g.fillStyle = rg; g.fillRect(0, 0, 1080, H); };
if (c.glow === 'red') { glow(800, '255,93,108', .16); glow(900, '76,125,255', .05); }
else glow(900, '76,125,255', c.glow === 'blue2' ? .26 : .16);
const hy = STORY ? 1180 : 820;
g.save(); g.beginPath(); g.rect(0, hy, 1080, H - hy); g.clip();
g.strokeStyle = c.glow === 'red' ? 'rgba(220,227,239,.07)' : 'rgba(76,125,255,.13)'; g.lineWidth = 1.5;
for (let i = -14; i <= 14; i++) { g.beginPath(); g.moveTo(540, hy); g.lineTo(540 + i * 210, H); g.stroke(); }
for (let j = 1; j < 14; j++) { const z = j / 14, y = hy + Math.pow(z, 2.4) * (H - hy); g.globalAlpha = Math.min(1, z * 3); g.beginPath(); g.moveTo(0, y); g.lineTo(1080, y); g.stroke(); }
g.restore(); g.globalAlpha = 1;
const hz = g.createLinearGradient(0, hy - 60, 0, hy + 160); hz.addColorStop(0, 'rgba(13,16,19,0)'); hz.addColorStop(.4, 'rgba(13,16,19,.9)'); hz.addColorStop(1, 'rgba(13,16,19,0)');
g.fillStyle = hz; g.fillRect(0, hy - 60, 1080, 220);
const vg = g.createRadialGradient(540, H / 2, 420, 540, H / 2, H * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
g.fillStyle = vg; g.fillRect(0, 0, 1080, H);

// story: the square card scaled into the safe zone
if (STORY) Object.assign(document.getElementById('card').style, { transform: 'scale(.88)', left: '65px', top: '285px' });
window.ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
