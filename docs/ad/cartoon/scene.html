<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BRB cartoon ad: scene</title>
<!--
  "Dave" — the 30-second cartoon ad, drawn on one canvas. render(t) draws the frame at t seconds.
  ?format=story (1080x1920, Reels and Stories; key action inside Meta's safe zone) or ?format=feed (1080x1350).
  ?t=12.5 shows one moment; ?play runs it in real time. render.cjs turns it into video.
  All the art is drawn in a 1080x900 "stage"; each format places the stage and the captions.
-->
<style>
@font-face { font-family: Michroma; src: url(../../../assets/fonts/michroma-400-latin.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Manrope; src: url(../../../assets/fonts/manrope-var-latin.woff2) format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'DM Mono'; src: url(../../../assets/fonts/dmmono-500-latin.woff2) format('woff2'); font-weight: 500; }
html, body { margin: 0; width: 1080px; overflow: hidden; background: #000; }
#c { position: absolute; left: 0; top: 0; }
#cap { position: absolute; left: 70px; width: 940px; display: flex; align-items: center; }
.phrase { position: absolute; left: 0; width: 940px; text-align: center; font-family: Manrope; font-weight: 800; line-height: 1.08; letter-spacing: -.02em; color: #fff; }
.phrase .box { display: inline-block; max-width: 940px; padding: 18px 34px 22px; border-radius: 34px; background: rgba(20, 22, 38, .86); box-shadow: 0 0 0 5px #1b1d2a, 0 14px 0 #1b1d2a; }
.phrase .w { display: inline-block; white-space: pre; }
.phrase .bad { color: #ffb35c; }
.phrase .hl { color: #8fb0ff; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="cap"></div>
<script>
/* ---------------- setup ---------------- */
const LAYOUTS = {
  story: { H: 1920, capTop: 270, capH: 250, font: 86, stageTop: 520, s: 1 },
  feed:  { H: 1350, capTop: 40,  capH: 250, font: 84, stageTop: 330, s: 1 }
};
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get('format') === 'feed' ? 'feed' : 'story';
const L = LAYOUTS[FORMAT];
const DUR = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.height = L.H; document.documentElement.style.height = document.body.style.height = L.H + 'px';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------------- palette ---------------- */
const OUT = '#1b1d2a', LW = 7;
const SKIN = '#f1c39b', SKIN_D = '#dca37c', HAIR = '#5b3a25', SHIRT = '#e4572e', SHIRT_D = '#bf4220', PANTS = '#34507a', SHOE = '#3a2a22';
const BRAND = '#1d5cff', LIFT = '#4c7dff';

/* ---------------- primitives ---------------- */
function path(fill, lw = LW, close = true) {
  if (close) ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function rr(x, y, w, h, r, fill, lw = LW) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); path(fill, lw, false); }
function circ(x, y, r, fill, lw = LW) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); path(fill, lw, false); }
function ell(x, y, rx, ry, fill, lw = LW, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); path(fill, lw, false); }
function poly(pts, fill, lw = LW) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); path(fill, lw); }
function stroke2(pts, w, col, lw = LW) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = OUT; ctx.lineWidth = w + lw * 2; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function line(x1, y1, x2, y2, col = OUT, w = 5) { ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); }
function text(s, x, y, size, col = OUT, weight = 800, align = 'center', fam = 'Manrope') {
  ctx.font = `${weight} ${size}px ${fam}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function glow(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
// a speech/notification bubble that pops in at time a (scale with overshoot)
function bubble(t, a, x, y, label, o = {}) {
  const k = lin(t, a, a + .28); if (k <= 0) return;
  const out = o.until ? lin(t, o.until, o.until + .2) : 0; if (out >= 1) return;
  const size = (o.size || 34) * 1.12;
  ctx.save(); ctx.translate(x, y); const sc = mix(.4, 1, back(k)) * (1 - out * .3); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 3) * (1 - out);
  ctx.font = `800 ${size}px Manrope`; const tw = ctx.measureText(label).width;
  const icon = o.icon ? size * 1.15 : 0, padX = size * .7, w = tw + padX * 2 + icon, h = size * 2;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2);
  if (o.tail) { ctx.moveTo(-14 + o.tail, h / 2 - 2); ctx.lineTo(o.tail, h / 2 + 22); ctx.lineTo(14 + o.tail, h / 2 - 2); }
  path(o.fill || '#ffffff', 6, false);
  if (o.tail) { ctx.fillStyle = o.fill || '#ffffff'; ctx.fillRect(-16 + o.tail, h / 2 - 9, 32, 9); }
  const tx = -w / 2 + padX + icon;
  if (o.icon === 'check') { circ(-w / 2 + padX + size * .42, 0, size * .45, '#2fbf71', 4); ctx.beginPath(); ctx.moveTo(-w / 2 + padX + size * .2, 0); ctx.lineTo(-w / 2 + padX + size * .38, size * .18); ctx.lineTo(-w / 2 + padX + size * .66, -size * .16); ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke(); }
  if (o.icon === 'alert') { circ(-w / 2 + padX + size * .42, 0, size * .45, '#ff4d5e', 4); text('!', -w / 2 + padX + size * .42, 2, size * .7, '#fff'); }
  if (o.icon === 'blue') { circ(-w / 2 + padX + size * .42, 0, size * .45, LIFT, 4); star(-w / 2 + padX + size * .42, 1, size * .28, '#ffffff'); }
  text(label, tx, 2, size, o.color || OUT, 800, 'left');
  ctx.restore();
}

/* ---------------- Dave ---------------- */
// feet at (x, y). p.* are pose numbers; angles are radians from straight down, + swings toward +x.
function limbPts(sx, sy, a1, a2, l1, l2) { const ex = sx + l1 * Math.sin(a1), ey = sy + l1 * Math.cos(a1); return [[sx, sy], [ex, ey], [ex + l2 * Math.sin(a1 + a2), ey + l2 * Math.cos(a1 + a2)], a1 + a2]; }
function dave(x, y, k, q = {}) {
  const p = Object.assign({ tired: 0, smile: 0, look: [0, 0], armL: [-.18, .12], armR: [.18, -.12], legL: [-.05, 0], legR: [.05, 0], blink: 0, mouth: 0,
    rot: 0, sweat: 0, hair: 0, holdL: null, holdR: null, surprise: 0, legs: true, headTilt: 0, bob: 0, brows: null, wink: 0, phoneGlow: 0, stars: 0, t: 0 }, q);
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.translate(0, -250); ctx.rotate(p.rot); ctx.translate(0, 250);
  ctx.translate(0, p.bob);
  // legs
  if (p.legs) [[-40, p.legL], [40, p.legR]].forEach(([hx, a]) => {
    const [h, kn, f] = limbPts(hx, -150, a[0], a[1], 80, 78);
    stroke2([h, kn, f], 48, PANTS);
    ell(f[0] + (hx < 0 ? -10 : 10), f[1] + 4, 34, 18, SHOE, 6);
  });
  // torso
  rr(-84, -348, 168, 214, 48, SHIRT);
  poly([[-36, -346], [0, -298], [36, -346]], SHIRT_D, 5);
  [-268, -230, -192].forEach(yy => circ(0, yy, 5, '#fff3e6', 3));
  rr(-84, -160, 168, 22, 6, '#3a2a22', 5);
  rr(18, -302, 50, 30, 6, '#ffffff', 4); text('DAVE', 43, -286, 15, OUT, 800);
  // arms
  [[-82, p.armL, p.holdL, -1], [82, p.armR, p.holdR, 1]].forEach(([sx, a, hold, side]) => {
    const [s, e, h, ang] = limbPts(sx, -322, a[0], a[1], 88, 84);
    const ctxLW = 44;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...s); ctx.lineTo(...e); ctx.lineTo(...h); ctx.strokeStyle = OUT; ctx.lineWidth = ctxLW + LW * 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...e); ctx.lineTo(...h); ctx.strokeStyle = SKIN; ctx.lineWidth = ctxLW - 6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...s); ctx.lineTo(mix(s[0], e[0], 1.12), mix(s[1], e[1], 1.12)); ctx.strokeStyle = SHIRT; ctx.lineWidth = ctxLW; ctx.stroke();
    holdItem(hold, h[0], h[1], ang, side, p);
    if (hold !== 'thumb') circ(h[0], h[1], 22, SKIN, 6);
  });
  // head
  ctx.save(); ctx.translate(0, -452); ctx.rotate(p.headTilt);
  if (p.phoneGlow) glow(0, 40, 170, '140,190,255', .35 * p.phoneGlow);
  circ(-98, 6, 21, SKIN, 6); circ(98, 6, 21, SKIN, 6);
  circ(0, 0, 100, SKIN);
  // hair
  ctx.beginPath();
  const n = 13;
  for (let i = 0; i <= n; i++) {
    const a = Math.PI * (1.07 + .86 * i / n);
    const r = (i % 2 ? 124 : 108) + p.hair * (hash(i) * 46 - 6) * (i % 2 ? 1 : .3);
    const px = Math.cos(a) * r, py = Math.sin(a) * r - 8;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.quadraticCurveTo(60, -70 + p.hair * 10, 10, -62); ctx.quadraticCurveTo(-50, -58, -99, -26);
  path(HAIR, 6);
  // stubble
  if (p.tired > .45) { ctx.fillStyle = `rgba(80,55,40,${(p.tired - .45) * 1.3})`; for (let i = 0; i < 26; i++) { const a = Math.PI * (.12 + .76 * hash(i + 5)), r = 62 + hash(i + 9) * 26; ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r + 6, 2.6, 0, TAU); ctx.fill(); } }
  // eyes
  const open = clamp(1 - p.blink);
  [-1, 1].forEach(sd => {
    const ex = sd * 38, ey = -10;
    const winkThis = sd === 1 ? p.wink : 0;
    if (p.tired > .2) { ctx.beginPath(); ctx.arc(ex, ey + 30, 20, .15 * Math.PI, .85 * Math.PI); ctx.strokeStyle = `rgba(120,80,150,${p.tired * .8})`; ctx.lineWidth = 5; ctx.stroke(); }
    if (open * (1 - winkThis) < .15) { ctx.beginPath(); ctx.arc(ex, ey + 4, 18, .1 * Math.PI, .9 * Math.PI); ctx.strokeStyle = OUT; ctx.lineWidth = 6; ctx.stroke(); return; }
    const ry = 27 * open * (1 + p.surprise * .25), rx = 22 * (1 + p.surprise * .2);
    ell(ex, ey, rx, ry, '#ffffff', 5);
    ctx.save(); ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, TAU); ctx.clip();
    circ(ex + p.look[0] * 9, ey + p.look[1] * 9 + 3, 11 * (1 - p.surprise * .2), OUT, 0);
    circ(ex + p.look[0] * 9 + 3, ey + p.look[1] * 9 - 1, 3.5, '#fff', 0);
    const droop = p.tired * .55;
    if (droop > 0) { ctx.fillStyle = SKIN_D; ctx.fillRect(ex - 30, ey - 40, 60, 12 + droop * 2 * ry); ctx.beginPath(); ctx.moveTo(ex - 30, ey - 28 + droop * 2 * ry); ctx.lineTo(ex + 30, ey - 28 + droop * 2 * ry); ctx.strokeStyle = OUT; ctx.lineWidth = 5; ctx.stroke(); }
    ctx.restore();
    ell(ex, ey, rx, ry, null, 5);
  });
  // brows: worried (inner up) when tired, raised when surprised, relaxed when happy
  const worry = p.brows !== null ? p.brows : clamp(p.tired * 1.1 - p.smile * .4, -1, 1);
  [-1, 1].forEach(sd => {
    const by = -50 - p.surprise * 18;
    line(sd * 18, by - worry * 10, sd * 58, by + worry * 8 - 4, OUT, 8);
  });
  // nose
  ctx.beginPath(); ctx.arc(0, 18, 13, .1 * Math.PI, .9 * Math.PI); ctx.strokeStyle = SKIN_D; ctx.lineWidth = 6; ctx.stroke();
  // mouth
  if (p.mouth > .05 || p.surprise > .3) {
    const mo = Math.max(p.mouth, p.surprise);
    ell(0, 52, 18 + p.smile * 10, 6 + mo * 16, '#7a2f2a', 5);
  } else {
    ctx.beginPath(); ctx.moveTo(-30, 50); ctx.quadraticCurveTo(0, 50 + p.smile * 34, 30, 50); ctx.strokeStyle = OUT; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke();
    if (p.smile > .6) { ctx.beginPath(); ctx.moveTo(-26, 52); ctx.quadraticCurveTo(0, 50 + p.smile * 30, 26, 52); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); }
  }
  // sweat
  if (p.sweat > 0) { ctx.globalAlpha = p.sweat; ctx.beginPath(); ctx.moveTo(84, -50); ctx.quadraticCurveTo(100, -18, 84, -12); ctx.quadraticCurveTo(68, -18, 84, -50); path('#8fd3ff', 4); ctx.globalAlpha = 1; }
  // dizzy stars
  if (p.stars > 0) for (let i = 0; i < 4; i++) { const a = p.t * 6 + i * TAU / 4; ctx.globalAlpha = p.stars; star(Math.cos(a) * 120, -130 + Math.sin(a) * 26, 18, '#ffd34d'); ctx.globalAlpha = 1; }
  ctx.restore();
  ctx.restore();
}
function star(x, y, r, col) { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; pts.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); } poly(pts, col, 4); }
function holdItem(what, x, y, ang, side, p) {
  if (!what) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(-ang + Math.PI);
  if (what === 'phone') { rr(-20, -62, 40, 70, 9, '#2a2f3d', 5); rr(-14, -55, 28, 52, 4, p.phoneGlow ? '#cfe3ff' : '#6f7b96', 0); }
  if (what === 'hammer') { line(0, 10, 0, -110, OUT, 18); line(0, 10, 0, -110, '#a0703f', 10); rr(-34, -136, 68, 30, 6, '#8d95a5', 5); }
  if (what === 'pencil') { line(0, 6, 0, -70, OUT, 16); line(0, 6, 0, -70, '#ffcc33', 9); poly([[-6, -70], [6, -70], [0, -86]], '#f1c39b', 3); }
  if (what === 'fork') { line(0, 6, 0, -80, OUT, 11); line(0, 6, 0, -80, '#c9ced8', 5); ctx.beginPath(); ctx.ellipse(0, -92, 22, 16, 0, 0, TAU); path('#f2c14e', 4, false); }
  if (what === 'mug') { rr(-26, -40, 52, 54, 8, '#ffffff', 5); ctx.beginPath(); ctx.arc(30, -14, 13, -Math.PI / 2, Math.PI / 2); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.stroke(); }
  ctx.restore();
  if (what === 'thumb') { circ(x, y, 24, SKIN, 6); ell(x + side * 2, y - 30, 11, 20, SKIN, 5); }
}

/* ---------------- little helpers: the blue dot, the dog, props ---------------- */
function dot(x, y, r, t, o = {}) {
  glow(x, y, r * 4, '76,125,255', .55);
  circ(x, y, r, LIFT, 5);
  const bl = (Math.sin(t * 3.1) > .96) ? .2 : 1;
  ell(x - r * .33, y - r * .1, r * .16, r * .24 * bl, '#fff', 0); ell(x + r * .33, y - r * .1, r * .16, r * .24 * bl, '#fff', 0);
  ctx.beginPath(); ctx.arc(x, y + r * .22, r * .3, .15 * Math.PI, .85 * Math.PI); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
}
function dog(x, y, k, mood, t) {
  // mood: 0 sad, 1 happy
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  const wag = Math.sin(t * (6 + mood * 18)) * (.15 + mood * .5);
  ctx.save(); ctx.translate(60, -60); ctx.rotate(-.9 + wag); stroke2([[0, 0], [0, -60]], 16, '#c98b4f', 6); ctx.restore();
  ell(0, -50, 78, 52, '#c98b4f');
  ell(-50, -6, 16, 12, '#c98b4f', 6); ell(40, -6, 16, 12, '#c98b4f', 6);
  ctx.save(); ctx.translate(-70, -118 + (1 - mood) * 10);
  ell(-36, 4, 18, 38, '#8a5a32', 6, .4 - mood * .3 + (1 - mood) * .2);
  circ(0, 0, 50, '#d99a5c');
  ell(34, 4, 18, 38, '#8a5a32', 6, -.4 + mood * .3 - (1 - mood) * .2);
  ell(0, 22, 26, 18, '#f1d1a8', 5);
  circ(0, 12, 8, OUT, 0);
  [-1, 1].forEach(s => { circ(s * 18, -10, 7, OUT, 0); if (mood < .5) line(s * 8, -26, s * 28, -20 - (1 - mood) * 4, OUT, 4); });
  if (mood > .5) { ell(6, 40, 9, 13, '#ff7a8a', 4); }
  ctx.restore(); ctx.restore();
}
function clock(x, y, r, h, m, fill = '#fffaf0') {
  circ(x, y, r, fill, 7);
  for (let i = 0; i < 12; i++) { const a = i * TAU / 12; line(x + Math.cos(a) * r * .78, y + Math.sin(a) * r * .78, x + Math.cos(a) * r * .88, y + Math.sin(a) * r * .88, OUT, 4); }
  const ha = (h % 12 + m / 60) / 12 * TAU - Math.PI / 2, ma = m / 60 * TAU - Math.PI / 2;
  line(x, y, x + Math.cos(ha) * r * .5, y + Math.sin(ha) * r * .5, OUT, 8);
  line(x, y, x + Math.cos(ma) * r * .75, y + Math.sin(ma) * r * .75, OUT, 6);
  circ(x, y, 6, OUT, 0);
}
function windowFrame(x, y, w, h, sky, extra) {
  rr(x - 14, y - 14, w + 28, h + 28, 10, '#e8dcc6');
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  if (typeof sky === 'string') { ctx.fillStyle = sky; ctx.fillRect(x, y, w, h); } else { const g = ctx.createLinearGradient(0, y, 0, y + h); sky.forEach((c, i) => g.addColorStop(i / (sky.length - 1), c)); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); }
  if (extra) extra();
  ctx.restore();
  ctx.beginPath(); ctx.rect(x, y, w, h); path(null, 7, false);
  line(x + w / 2, y, x + w / 2, y + h, OUT, 7); line(x, y + h / 2, x + w, y + h / 2, OUT, 7);
}
function desk(col = '#7a5236', top = 540) { rr(120, top, 840, 36, 10, col); rr(150, top + 36, 780, 180, 6, shade(col, -.18)); line(540, top + 50, 540, top + 200, OUT, 5); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; const f = v => Math.round(clamp(v + v * k, 0, 255)); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function phoneOnDesk(x, y, t, ringing, glowOn) {
  const sh = ringing ? Math.sin(t * 70) * 5 : 0;
  ctx.save(); ctx.translate(x + sh, y); rr(-46, -16, 92, 30, 8, '#2a2f3d', 5); rr(-38, -12, 76, 20, 4, glowOn ? '#cfe3ff' : '#55607a', 0); ctx.restore();
  if (ringing) for (let i = 0; i < 2; i++) { const ph = (t * 3 + i * .5) % 1; ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.arc(x, y, 60 + ph * 50, -2.6, -.5); ctx.strokeStyle = OUT; ctx.lineWidth = 6; ctx.stroke(); ctx.globalAlpha = 1; }
}
function mug(x, y, steam, t) { rr(x - 26, y - 56, 52, 56, 8, '#ffffff', 6); ctx.beginPath(); ctx.arc(x + 30, y - 30, 13, -Math.PI / 2, Math.PI / 2); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.stroke(); rr(x - 18, y - 46, 36, 10, 4, '#6b4430', 0);
  if (steam) for (let i = 0; i < 2; i++) { const ph = (t * .8 + i * .5) % 1; ctx.globalAlpha = (1 - ph) * .8; ctx.beginPath(); ctx.moveTo(x - 8 + i * 16, y - 66 - ph * 40); ctx.bezierCurveTo(x + 6 + i * 16, y - 80 - ph * 40, x - 20 + i * 16, y - 96 - ph * 40, x - 4 + i * 16, y - 110 - ph * 40); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.stroke(); ctx.globalAlpha = 1; } }
function plate(x, y, steam, t, eaten = 0) {
  ell(x, y, 120, 30, '#ffffff', 6); ell(x, y - 4, 84, 18, '#f3f0ea', 3);
  ctx.save(); ctx.beginPath(); ctx.ellipse(x, y - 12, 70 * (1 - eaten * .5), 24, 0, Math.PI, TAU); ctx.lineTo(x + 70, y - 6); ctx.closePath(); path('#f2c14e', 5, false);

  const g = ctx.createLinearGradient(0, -L.stageTop, 0, L.H); g.addColorStop(0, '#0d1b48'); g.addColorStop(.6, '#163a9e'); g.addColorStop(1, '#0d1b48');
  ctx.fillStyle = g; ctx.fillRect(0, -L.stageTop, 1080, L.H);
  ctx.save(); ctx.globalAlpha = .12; ctx.translate(540, 520); ctx.rotate(t * .1);
  for (let i = 0; i < 16; i++) { ctx.rotate(TAU / 16); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -1400); ctx.lineTo(60, -1400); ctx.closePath(); ctx.fillStyle = '#9db8ff'; ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#0a1438'; ctx.fillRect(0, 720, 1080, L.H); line(0, 720, 1080, 720, OUT, 7);
  const a = lin(t, S.p15, S.p15 + .4);
  // lockup
  ctx.save(); ctx.globalAlpha = eo(a); ctx.translate(0, (1 - eo(a)) * 30);
  ctx.font = '400 50px Michroma'; const lw = ctx.measureText('RUNS BETTER').width, lx = 540 - (118 + 30 + lw) / 2;
  ctx.save(); ctx.translate(lx, 20); ctx.scale(2.95, 2.95);
  ctx.beginPath(); ctx.roundRect(1.25, 1.25, 37.5, 37.5, 4.5); ctx.strokeStyle = 'rgba(220,227,239,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.lineCap = 'square'; line(9, 28.5, 31, 28.5, 'rgba(220,227,239,.8)', 3); line(9, 22, 29, 11.5, LIFT, 3); circ(30.25, 10.75, 3.25, LIFT, 0); ctx.restore();
  text('BUSINESS', lx + 148, 52, 50, '#f3f6fb', 400, 'left', 'Michroma'); text('RUNS BETTER', lx + 148, 112, 50, '#f3f6fb', 400, 'left', 'Michroma');
  ctx.restore();
  // url button, then phone
  const u = lin(t, S.cta, S.cta + .35);
  if (u > 0) {
    ctx.save(); ctx.translate(540, 232); const sc = mix(.6, 1, back(u)) + (t > S.cta + .6 ? Math.sin((t - S.cta) * 3.2) * .02 : 0); ctx.scale(sc, sc); ctx.globalAlpha = clamp(u * 2);
    glow(0, 0, 360, '76,125,255', .5);
    ctx.font = '800 50px Manrope'; const w = ctx.measureText('businessrunsbetter.com').width + 110;
    rr(-w / 2, -58, w, 116, 58, BRAND, 7); text('businessrunsbetter.com', 0, 3, 50, '#ffffff', 800);
    ctx.restore();
  }
  const ph = lin(t, S.cta + .7, S.cta + 1.0);
  if (ph > 0) { ctx.globalAlpha = ph; text('Free 20-minute call · 910-524-0056', 540, 336, 36, '#dbe5ff', 700); ctx.globalAlpha = 1; }
  // Dave and the dot, relaxed
  const dv = lin(t, S.p15 + .1, S.p15 + .5);
  dave(470, 720 + (1 - eo(dv)) * 300, .64, { tired: 0, smile: 1, hair: .1, look: [.5, -.2], blink: blinkAt(t, 2), armR: [2.6, .5], holdR: 'thumb', armL: [-.3, -.2], wink: lin(t, 28.2, 28.3) * (1 - lin(t, 28.6, 28.7)), t });
  dot(660, 520 + Math.sin(t * 2.4) * 12, 26, t);
}

/* ---------------- timeline ---------------- */
let SCENES = [];
function iris(t, a, b, closing, cx, cy) {
  const k = lin(t, a, b); if (k <= 0 || t >= b) return;
  const r = closing ? mix(1300, 0, eio(k)) : mix(0, 1300, eio(k));
  ctx.save(); ctx.beginPath(); ctx.rect(0, -L.stageTop, 1080, L.H); ctx.arc(cx, cy, Math.max(0, r), 0, TAU, true); ctx.fillStyle = '#0b0c14'; ctx.fill('evenodd'); ctx.restore();
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1080, L.H);
  ctx.translate(0, L.stageTop); ctx.scale(L.s, L.s);
  const sc = SCENES.find(s => t >= s.a && t < s.b) || SCENES[SCENES.length - 1];
  // a small zoom punch on every hard cut
  const punch = sc.punch ? 1 + (1 - eo(lin(t, sc.a, sc.a + .25))) * .06 : 1;
  ctx.save(); ctx.translate(540, 450); ctx.scale(punch, punch); ctx.translate(-540, -450);
  sc.fn(t);
  ctx.restore();
  iris(t, S.p10 - .3, S.p10, true, 540, 250);
  iris(t, S.p10, S.p10 + .3, false, 540, 300);
  renderCaptions(t);
}

/* ---------------- captions ---------------- */
const PHRASES = [
  { n: 3 }, { n: 5 }, { n: 4, cls: { 0: 'bad' } }, { n: 3, cls: { 0: 'bad' } }, { n: 3, cls: { 0: 'bad', 2: 'bad' } }, { n: 4, cls: { 0: 'bad', 2: 'bad', 3: 'bad' }, show: { 2: '5', 3: 'AM.' } },
  { n: 2, cls: { 1: 'bad' } }, { n: 2, cls: { 1: 'bad' } },
  { n: 6, cls: { 3: 'hl', 4: 'hl', 5: 'hl' } }, { n: 6, cls: { 5: 'hl' } }, { n: 3, cls: { 2: 'hl' } }, { n: 5, cls: { 4: 'hl' } },
  { n: 2 }, { n: 6, cls: { 3: 'hl', 4: 'hl', 5: 'hl' } },
  { n: 10, cut: 4, cls: { 2: 'hl' } }
];
let PH = [], W = [];
function buildCaptions(words) {
  W = words.map(([w, s, e]) => ({ w, s, e }));
  const cap = document.getElementById('cap');
  Object.assign(cap.style, { top: L.capTop + 'px', height: L.capH + 'px' });
  let i = 0;
  PHRASES.forEach((p, pi) => {
    const ws = W.slice(i, i + p.n); i += p.n;
    const el = document.createElement('div'); el.className = 'phrase'; el.style.fontSize = L.font + 'px';
    const box = document.createElement('span'); box.className = 'box'; el.appendChild(box);
    const shown = p.cut ? ws.slice(0, p.cut) : ws;
    shown.forEach((w, k) => {
      const s = document.createElement('span'); s.className = 'w' + (p.cls && p.cls[k] ? ' ' + p.cls[k] : '');
      let txt = (p.show && p.show[k]) || w.w;
      if (p.cut && k === shown.length - 1) txt += '.';
      s.textContent = txt + (k < shown.length - 1 ? ' ' : ''); box.appendChild(s); w.el = s;
    });
    cap.appendChild(el);
    PH.push({ el, ws, shown, start: pi === 0 ? 0.3 : ws[0].s - .12 });
  });
  PH.forEach((p, k) => { p.end = k < PH.length - 1 ? PH[k + 1].start : DUR + 1; p.el.style.top = (L.capH - p.el.offsetHeight) / 2 + 'px'; });
}
function renderCaptions(t) {
  PH.forEach(p => {
    const inK = lin(t, p.start, p.start + .14), outK = lin(t, p.end - .1, p.end);
    const o = eo(inK) * (1 - outK);
    p.el.style.opacity = o; p.el.style.visibility = o <= .001 ? 'hidden' : 'visible';
    p.el.style.transform = `translateY(${(1 - eo(inK)) * 24}px) scale(${mix(.9, 1, back(inK))})`;
    if (o <= 0) return;
    p.shown.forEach(w => { const k = lin(t, w.s - .05, w.s + .1); w.el.style.opacity = mix(.35, 1, k); w.el.style.transform = `translateY(${(1 - eo(k)) * 8}px)`; });
  });
}

window.ready = (async () => {
  const words = await (await fetch('words-timed.json')).json();
  await Promise.all([document.fonts.load('800 80px Manrope'), document.fonts.load('40px Michroma'), document.fonts.load('500 20px "DM Mono"')]);
  await document.fonts.ready;
  buildCaptions(words);
  const ps = PH.map(p => p.ws[0].s);
  ps.forEach((v, i) => { S['p' + (i + 1)] = v - .12; });
  S.p1 = 0;
  const behind = W.find(w => w.w === 'behind.');
  S.fling = behind.e + .1;
  S.cta = W[W.length - 5].s - .05;    // "Business" in "...at Business Runs Better dot com"
  // the wheel's angle is the integral of its speed, so it never jumps
  const angs = []; let acc = 0;
  for (let i = 0; i <= 3000; i++) { const t = i / 100; const sp = t < S.fling ? mix(4, 22, lin(t, S.p7, S.fling)) : mix(22, 0, lin(t, S.fling, S.fling + 1.8)); acc += sp * .01 * .35; angs.push(acc); }
  S.wheelAng = t => angs[Math.min(3000, Math.max(0, Math.round(t * 100)))];
  SCENES = [
    { a: 0, b: S.p3, fn: sIntro },
    { a: S.p3, b: S.p4, fn: sRoof, punch: 1 },
    { a: S.p4, b: S.p5, fn: sDinnerBad, punch: 1 },
    { a: S.p5, b: S.p6, fn: sMidnight, punch: 1 },
    { a: S.p6, b: S.p7, fn: sFiveAM, punch: 1 },
    { a: S.p7, b: S.p10, fn: sWheel, punch: 1 },
    { a: S.p10, b: S.p11, fn: sLeads },
    { a: S.p11, b: S.p12, fn: sQuotes, punch: 1 },
    { a: S.p12, b: S.p13, fn: sWeb, punch: 1 },
    { a: S.p13, b: S.p14, fn: sAndDave },
    { a: S.p14, b: S.p15, fn: sDinnerGood, punch: 1 },
    { a: S.p15, b: DUR + 1, fn: sCTA }
  ];
  window.render = render;
  if (Q.has('play')) { const t0 = performance.now(); const f = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(f); }; f(); }
  else render(parseFloat(Q.get('t') || '0'));
  return true;
})();
</script>
