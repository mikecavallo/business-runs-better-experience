<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BRB "Meet Ray" video: scene</title>
<!--
  The 60-second "Meet Ray" marketing video (1920x1080), drawn as one deterministic page.
  render(t) puts every element where it belongs at time t (seconds); render.cjs steps t
  frame by frame, screenshots each one and pipes them to ffmpeg.
  Open with ?t=12.5 to look at one moment, or ?play to watch it run (no sound).
  Voiceover line start times live in timeline.json; word timings in segments.json.
-->
<style>
@font-face { font-family: Michroma; src: url(../../assets/fonts/michroma-400-latin.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Manrope; src: url(../../assets/fonts/manrope-var-latin.woff2) format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'DM Mono'; src: url(../../assets/fonts/dmmono-400-latin.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'DM Mono'; src: url(../../assets/fonts/dmmono-500-latin.woff2) format('woff2'); font-weight: 500; }
:root {
  --brand: #1d5cff; --lift: #4c7dff; --rgb: 76, 125, 255;
  --ink: #f3f6fb; --muted: #a8b2c4; --dim: #8b95a8;
  --red: #ff5d6c; --redrgb: 255, 93, 108; --green: #2fd27a; --hat: #ffc83d;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: var(--ink);
  font-family: Manrope, sans-serif; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.mono { font-family: 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
#stage { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; overflow: hidden; display: none; transform-origin: 50% 50%; }
svg { overflow: visible; }
.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

/* big kinetic type */
.big { font-weight: 800; font-size: 118px; line-height: 1; letter-spacing: -.03em; white-space: nowrap; transform-origin: 0 50%; text-shadow: 0 8px 40px rgba(0,0,0,.45); }
.big.red { color: var(--red); }
.plate b { display: block; font-family: Michroma; font-weight: 400; font-size: 150px; line-height: 1; letter-spacing: .02em; }
.plate span { display: block; margin-top: 22px; font-size: 30px; color: #fff; }
.plate i { display: block; width: 120px; height: 10px; background: var(--hat); margin-bottom: 30px; }

/* notification chips */
.chip { position: absolute; display: flex; align-items: center; gap: 16px; padding: 16px 26px 16px 16px; border-radius: 24px; white-space: nowrap;
  background: rgba(22, 24, 30, .93); box-shadow: 0 18px 44px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(255,255,255,.09); font-size: 30px; font-weight: 700; }
.chip u { width: 52px; height: 52px; border-radius: 15px; background: rgba(var(--redrgb), .18); display: grid; place-items: center; text-decoration: none; }
.chip u svg { width: 30px; height: 30px; }
.chip small { display: block; font-family: 'DM Mono'; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 400; }

/* phones */
.phone { position: absolute; border-radius: 62px; padding: 13px; background: linear-gradient(160deg, #2a3039, #14171c 40%, #1a1e24);
  box-shadow: 0 50px 120px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.08); }
.screen { position: absolute; inset: 13px; border-radius: 50px; overflow: hidden; background: linear-gradient(180deg, #171b21, #111418); }
.island { position: absolute; left: 50%; top: 16px; width: 130px; height: 36px; margin-left: -65px; background: #000; border-radius: 20px; z-index: 5; }
.pstat { position: absolute; left: 0; right: 0; top: 0; height: 66px; padding: 20px 40px 0; display: flex; justify-content: space-between; font-weight: 700; font-size: 21px; }
.msg { position: absolute; max-width: 300px; padding: 14px 18px; border-radius: 22px; font-size: 20.5px; line-height: 1.28; font-weight: 600; }
.msg.in { left: 0; background: #2a3039; border-bottom-left-radius: 7px; transform-origin: 0 100%; }
.msg.out { right: 0; background: var(--brand); color: #fff; border-bottom-right-radius: 7px; transform-origin: 100% 100%; }
.missed { position: absolute; left: 22px; right: 22px; height: 96px; border-radius: 24px; background: rgba(40, 44, 54, .96); display: flex; align-items: center; gap: 16px; padding: 0 18px;
  box-shadow: inset 0 0 0 1.5px rgba(var(--redrgb), .35); }
.missed u { width: 56px; height: 56px; border-radius: 16px; background: rgba(var(--redrgb), .2); display: grid; place-items: center; }
.missed b { display: block; font-size: 24px; color: var(--red); }
.missed span { display: block; font-size: 17px; color: var(--dim); margin-top: 3px; }

/* browser */
.browser { position: absolute; border-radius: 22px; overflow: hidden; background: #fff; color: #171a20; box-shadow: 0 50px 120px rgba(0,0,0,.55); }
.browser .bar { position: absolute; left: 0; right: 0; top: 0; height: 58px; background: #e8eaee; display: flex; align-items: center; gap: 10px; padding: 0 22px; }
.browser .bar i { width: 14px; height: 14px; border-radius: 50%; background: #c7cbd3; display: block; }
.browser .bar .url { flex: 1; margin-left: 16px; height: 36px; border-radius: 18px; background: #fff; display: flex; align-items: center; padding: 0 18px; font-size: 18px; color: #555b66; font-weight: 600; gap: 10px; }
.res { position: absolute; left: 60px; right: 60px; height: 132px; }
.res em { display: block; font-style: normal; font-size: 18px; color: #6b7280; }
.res b { display: block; font-size: 34px; color: #1a3fb8; margin-top: 4px; }
.res span { display: block; font-size: 20px; color: #4b5563; margin-top: 6px; }
.pg { position: absolute; left: 60px; right: 60px; height: 50px; border-top: 2px solid #e5e7eb; font-family: 'DM Mono'; font-size: 20px; letter-spacing: .1em; color: #9aa1ad; padding-top: 14px; text-transform: uppercase; }

/* solution scenes */
.tagchip { position: absolute; right: 80px; top: 62px; padding: 12px 22px; border-radius: 30px; font-size: 21px; color: #dbe5ff;
  background: rgba(var(--rgb), .16); box-shadow: inset 0 0 0 1.5px rgba(var(--rgb), .55); white-space: nowrap; }
.hl { position: absolute; left: 120px; top: 232px; width: 700px; font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -.03em; }
.hl em { font-style: normal; color: var(--lift); }
.sub { position: absolute; left: 120px; top: 468px; width: 640px; font-size: 33px; line-height: 1.35; color: var(--muted); font-weight: 500; }
.glass { position: absolute; border-radius: 28px; background: rgba(18, 24, 44, .92); box-shadow: 0 40px 100px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(160,185,255,.16); }
.card { position: absolute; border-radius: 26px; background: #fff; color: #14171c; box-shadow: 0 40px 90px rgba(0,0,0,.5); }
#bug { position: absolute; left: 80px; top: 54px; display: flex; align-items: center; gap: 18px; font-family: Michroma; font-size: 21px; letter-spacing: .08em; }
#bug svg { width: 54px; height: 54px; }
#pip { position: absolute; left: 120px; top: 690px; width: 270px; height: 270px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 5px rgba(var(--rgb), .9), 0 0 0 14px rgba(var(--rgb), .18), 0 30px 70px rgba(0,0,0,.5); }
#pipLab { position: absolute; left: 428px; top: 782px; font-size: 21px; line-height: 1.5; color: var(--muted); }
#pipLab b { display: block; color: var(--ink); font-weight: 500; font-size: 24px; }
.kpi { position: absolute; top: 96px; width: 284px; height: 150px; border-radius: 20px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.08); padding: 22px 26px; }
.kpi span { font-size: 17px; color: var(--dim); display: block; }
.kpi b { display: block; font-size: 62px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
.barrow { position: absolute; left: 34px; width: 520px; height: 44px; font-size: 20px; font-weight: 600; color: var(--muted); }
.barrow i { position: absolute; left: 150px; top: 6px; height: 30px; border-radius: 8px; background: linear-gradient(90deg, var(--brand), var(--lift)); display: block; transform-origin: 0 50%; }
.barrow b { position: absolute; top: 4px; font-size: 24px; color: var(--ink); }

/* end card */
#end { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; }
#eLock { position: absolute; left: 0; width: 1920px; top: 190px; display: flex; justify-content: center; align-items: center; gap: 36px; }
#eLock svg { width: 132px; height: 132px; }
#eLock b { font-family: Michroma; font-weight: 400; font-size: 68px; letter-spacing: .05em; }
#eTag { position: absolute; left: 0; width: 1920px; top: 372px; font-size: 30px; color: var(--muted); }
#eCta { position: absolute; left: 50%; top: 478px; height: 136px; line-height: 136px; padding: 0 76px; border-radius: 68px; background: var(--brand); white-space: nowrap;
  font-size: 58px; font-weight: 800; letter-spacing: -.01em; }
#eUrl { position: absolute; left: 0; width: 1920px; top: 668px; font-size: 54px; font-weight: 800; letter-spacing: -.01em; }
#eUrl span { color: var(--muted); font-weight: 600; margin: 0 22px; }
#eWhere { position: absolute; left: 0; width: 1920px; top: 768px; font-size: 23px; color: var(--dim); }
#eRay { position: absolute; left: 0; width: 1920px; top: 850px; font-size: 29px; color: var(--muted); font-style: italic; font-weight: 500; }

/* captions */
#cap { position: absolute; left: 0; width: 1920px; top: 968px; height: 76px; z-index: 50; }
.cl { position: absolute; left: 50%; top: 0; white-space: nowrap; padding: 14px 30px; border-radius: 22px; background: rgba(6, 8, 12, .78); font-size: 38px; font-weight: 700; letter-spacing: -.005em; }
.cl span { white-space: pre; }
#vig { position: absolute; inset: 0; z-index: 40; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); }
#flash { position: absolute; inset: 0; z-index: 45; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>

<div class="scene" id="sA"></div>
<div class="scene" id="sB"></div>
<div class="scene" id="sC"></div>
<div class="scene" id="sD"></div>
<div class="scene" id="sE"></div>
<div class="scene" id="sF"></div>
<div class="scene" id="sG"></div>
<div class="scene" id="sH"></div>
<div class="scene" id="sI"></div>
<div class="scene" id="sJ"></div>
<div class="scene" id="sK"></div>
<div class="scene" id="sL"></div>

<div id="sol" class="abs" style="inset:0;display:none">
  <div id="bug"><svg viewBox="0 0 40 40"><rect x="1.25" y="1.25" width="37.5" height="37.5" rx="4.5" fill="none" stroke="#dce3ef" stroke-opacity=".3" stroke-width="1.3"/><path d="M9 28.5 H31" stroke="#dce3ef" stroke-opacity=".6" stroke-width="2.8" stroke-linecap="square"/><path d="M9 22 L29 11.5" stroke="#4c7dff" stroke-width="2.8" stroke-linecap="square"/><circle cx="30.25" cy="10.75" r="3.25" fill="#4c7dff"/></svg>BUSINESS RUNS BETTER</div>
  <div id="pip"></div>
  <div id="pipLab" class="mono"></div>
</div>

<div id="vig"></div>
<div id="flash"></div>
<div id="cap"></div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
function set(el, o, tf) { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; }
function pop(el, t, a, d = .32, from = .8, extra = '') { const k = lin(t, a, a + d); set(el, eo(k), `${extra} scale(${mix(from, 1, back(k))}) translateY(${(1 - eo(k)) * 18}px)`); }
function slam(el, t, a, extra = '') { const k = lin(t, a, a + .2); set(el, lin(t, a, a + .06), `${extra} scale(${mix(1.7, 1, eo(k))})`); }
function slide(el, t, a, dx = 90, d = .5) { const k = lin(t, a, a + d); set(el, eo(k), `translateX(${(1 - eo(k)) * dx}px)`); }
function rise(el, t, a, dy = 40, d = .45) { const k = lin(t, a, a + d); set(el, eo(k), `translateY(${(1 - eo(k)) * dy}px)`); }
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

let TL, SEG, DUR = 60;
const S = i => TL.starts[i];
const wt = (i, k) => S(i) + SEG[i].words[k][1];
const SC = { A: [0, 7.3], B: [7.3, 12.05], C: [12.05, 15.35], D: [15.35, 18.55], E: [18.55, 22.45], F: [22.45, 27.6],
  G: [27.6, 31.75], H: [31.75, 36.95], I: [36.95, 41.95], J: [41.95, 46.1], K: [46.1, 51.0], L: [51.0, 60.5] };
const HIT = 26.35;   // the logo lands here; the music drops with it

function scene(id, t, cam = .06) {
  const [a, b] = SC[id], el = $('s' + id), on = t >= a && t < b;
  el.style.display = on ? 'block' : 'none';
  if (on && cam) el.style.transform = `scale(${1 + cam - cam * eo(lin(t, a, a + .9)) + .035 * lin(t, a, b)})`;
  return on;
}

/* ============================================================ the people */
const ICON = {
  phoneX: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff5d6c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h3l2 5-2.5 1.5a11 11 0 0 0 7 7L16 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/><path d="M15 3l6 6M21 3l-6 6"/></svg>',
  phone: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h3l2 5-2.5 1.5a11 11 0 0 0 7 7L16 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg>`,
  msg: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff5d6c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff5d6c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="#ff5d6c"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff5d6c" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check: (c = '#fff', w = 3) => `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const ITEM = {
  hammer: '<rect x="-7" y="-14" width="14" height="128" rx="6" fill="#8a5a33"/><rect x="-40" y="96" width="74" height="34" rx="7" fill="#9aa3b2"/><rect x="-40" y="96" width="18" height="34" rx="4" fill="#6f7888"/>',
  bundle: '<g transform="rotate(90)"><rect x="-40" y="-150" width="80" height="230" rx="8" fill="#3b4150"/><path d="M-40,-90H40M-40,-30H40M-40,30H40" stroke="#2a2f3a" stroke-width="5"/><rect x="-40" y="-150" width="80" height="16" fill="#555d70"/></g>',
  cash: '<g transform="rotate(-80)"><rect x="-34" y="-10" width="68" height="110" rx="6" fill="#2e9e62"/><rect x="-26" y="-2" width="52" height="94" rx="4" fill="none" stroke="#bdf0d2" stroke-width="3"/><circle cx="0" cy="45" r="15" fill="#bdf0d2"/></g>',
  fork: '<rect x="-4" y="0" width="8" height="100" rx="4" fill="#cfd5df"/><path d="M-12,96v26M0,96v26M12,96v26" stroke="#cfd5df" stroke-width="5" stroke-linecap="round"/>',
  thumb: '<rect x="-10" y="-52" width="20" height="44" rx="10" fill="SKIN" transform="rotate(180)"/>',
};
const P = {};   // person instances by id
function person(id, o = {}) {
  const skin = o.skin || '#e3a47a', skinD = o.skinD || '#c98659', shirt = o.shirt || '#e8772e', shirtD = o.shirtD || '#c05b1b';
  const arm = (s, item) => `<g class="arm${s}"><path class="up" stroke="${shirt}" stroke-width="54" stroke-linecap="round" fill="none"/><path class="fo" stroke="${skin}" stroke-width="36" stroke-linecap="round" fill="none"/>
    <g class="hand"><g class="item">${(item || '').replace(/SKIN/g, skin)}</g><circle r="24" fill="${skin}"/></g></g>`;
  const top = o.hat === false
    ? `<path d="M-66,-104 Q-76,-176 0,-178 Q76,-176 66,-104 Q44,-142 0,-140 Q-44,-142 -66,-104Z" fill="${o.hair || '#4a3324'}"/>`
    : `<path d="M-72,-124 Q-72,-208 0,-208 Q72,-208 72,-124 Z" fill="#ffc83d"/><rect x="-9" y="-208" width="18" height="84" rx="6" fill="#ffe08a"/><rect x="-88" y="-134" width="176" height="18" rx="9" fill="#eeb224"/>`;
  P[id] = { o };
  return `<g id="${id}">
    <rect x="-23" y="-34" width="46" height="46" fill="${skinD}"/>
    <path d="M-120,50 Q-124,6 -58,0 L58,0 Q124,6 120,50 L130,340 L-130,340 Z" fill="${shirt}"/>
    <path d="M-26,0 L0,36 L26,0 Z" fill="${skinD}"/>
    <path d="M-34,0 L0,46 L34,0 L24,-2 L0,30 L-24,-2Z" fill="${shirtD}"/>
    ${o.kid ? '' : `<rect x="36" y="74" width="54" height="42" rx="7" fill="${shirtD}"/>`}
    ${o.back ? arm('L', o.itemL) + arm('R', o.itemR) : ''}
    <g class="head">
      <circle cx="-64" cy="-86" r="14" fill="${skinD}"/><circle cx="64" cy="-86" r="14" fill="${skinD}"/>
      <rect x="-63" y="-152" width="126" height="134" rx="57" fill="${skin}"/>
      ${o.kid ? '' : `<path d="M-63,-84 Q-63,-18 0,-18 Q63,-18 63,-84 Q42,-52 0,-52 Q-42,-52 -63,-84Z" fill="#3a2418" opacity=".2"/>`}
      <g class="bags"><path d="M-36,-76 q11,8 22,0M14,-76 q11,8 22,0" fill="none" stroke="#8c5a3c" stroke-width="4" stroke-linecap="round"/></g>
      <g class="eyes"><ellipse class="eye" cx="-25" cy="-92" rx="7.5" ry="10" fill="#1b1b22"/><ellipse class="eye" cx="25" cy="-92" rx="7.5" ry="10" fill="#1b1b22"/></g>
      <path class="browL" d="M-14,0H14" stroke="#3a2418" stroke-width="8" stroke-linecap="round"/>
      <path class="browR" d="M-14,0H14" stroke="#3a2418" stroke-width="8" stroke-linecap="round"/>
      <path d="M1,-86 q9,17 -5,21" fill="none" stroke="${skinD}" stroke-width="5" stroke-linecap="round"/>
      <path class="mouth" fill="none" stroke="#5a2b1f" stroke-width="6.5" stroke-linecap="round"/>
      <path class="grin" d="M-26,-58 Q0,-22 26,-58 Z" fill="#fff" stroke="#5a2b1f" stroke-width="5" stroke-linejoin="round"/>
      <ellipse class="mopen" cx="0" cy="-46" rx="14" ry="10" fill="#5a2b1f"/>
      ${top}
      <g class="sweat"><path class="d1" d="M0,0 q9,14 0,20 q-9,-6 0,-20Z" fill="#9fd4ff"/><path class="d2" d="M0,0 q9,14 0,20 q-9,-6 0,-20Z" fill="#9fd4ff"/></g>
    </g>
    ${o.back ? '' : arm('L', o.itemL) + arm('R', o.itemR)}
  </g>`;
}
function pose(id, t, p = {}) {
  const g = $(id); if (!g) return;
  const c = P[id].q || (P[id].q = Object.fromEntries(['head', 'bags', 'eyes', 'browL', 'browR', 'mouth', 'grin', 'mopen', 'sweat', 'armL', 'armR'].map(k => [k, g.querySelector('.' + k)])));
  const b = p.brow || 0, by = p.browY || 0, sm = p.smile ?? 6, open = p.open || 0, grin = p.grin || 0;
  c.head.setAttribute('transform', `translate(0,${p.headY || 0}) rotate(${p.head || 0} 0 -10)`);
  c.browL.setAttribute('transform', `translate(-26,${-116 + by}) rotate(${-b})`);
  c.browR.setAttribute('transform', `translate(26,${-116 + by}) rotate(${b})`);
  const blink = ((t + (P[id].o.kid ? 1.3 : 0)) % 2.9) < .11 ? .1 : 1;
  const ey = (p.eye ?? 1) * blink;
  c.eyes.setAttribute('transform', `translate(${(p.look || 0) * 6},${(p.lookY || 0) * 4})`);
  c.eyes.querySelectorAll('.eye').forEach(e => e.setAttribute('ry', Math.max(1.2, 10 * ey)));
  c.bags.style.opacity = p.bags || 0;
  c.mouth.setAttribute('d', `M-22,-52 Q0,${-52 + sm * 1.7} 22,-52`);
  c.mouth.style.opacity = open > .08 || grin > .5 ? 0 : 1;
  c.grin.style.opacity = grin > .5 && open <= .08 ? 1 : 0;
  c.mopen.style.opacity = open > .08 ? 1 : 0; c.mopen.setAttribute('ry', 4 + open * 16); c.mopen.setAttribute('rx', 11 + open * 5);
  const sw = p.sweat || 0; c.sweat.style.opacity = sw;
  if (sw > 0) { const k1 = (t * 1.1) % 1, k2 = (t * 1.1 + .5) % 1;

/* ============================================================ captions */
let CL = [];
function buildCaptions() {
  SEG.forEach((sg, si) => {
    let chunk = [];
    const flush = () => {
      if (!chunk.length) return;
      const el = document.createElement('div'); el.className = 'cl';
      const ws = chunk.map(w => { const s = document.createElement('span'); s.textContent = w[0] + ' '; el.appendChild(s); return { el: s, s: S(si) + w[1] }; });
      ws[ws.length - 1].el.textContent = chunk[chunk.length - 1][0];
      $('cap').appendChild(el);
      CL.push({ el, ws, start: ws[0].s - .1, endW: S(si) + chunk[chunk.length - 1][2] }); chunk = [];
    };
    sg.words.forEach((w, k) => { chunk.push(w); const last = k === sg.words.length - 1; if (last || (/[.?!]$/.test(w[0]) && chunk.length >= 2) || (/,$/.test(w[0]) && chunk.length >= 5 && sg.words.length - k > 3)) flush(); });
  });
  CL.forEach((c, i) => { c.end = Math.min(c.endW + .7, i < CL.length - 1 ? CL[i + 1].start : DUR); });
}
function renderCaptions(t) {
  CL.forEach(c => {
    const o = lin(t, c.start, c.start + .12) * (1 - lin(t, c.end - .1, c.end));
    set(c.el, o, `translateX(-50%) translateY(${(1 - eo(lin(t, c.start, c.start + .14))) * 10}px)`);
    if (o > 0) c.ws.forEach(w => { w.el.style.opacity = mix(.42, 1, lin(t, w.s - .04, w.s + .1)); });
  });
}

function renderStage(t) {
  const on = t >= HIT - .05 && (t < SC.K[0] || t >= SC.L[0]);
  cv.style.visibility = on ? 'visible' : 'hidden'; if (!on) return;
  const k = lin(t, HIT, HIT + .5), night = lin(t, SC.I[0], SC.I[0] + .5) * (1 - lin(t, SC.I[1] - .3, SC.I[1]));
